name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests
        run: python -m unittest discover -s tests -q
      - name: Skill MCP reference validation
        run: python helpers/validate_skill_mcp_refs.py
      - name: Install packaging smoke
        run: |
          python install.py --dest .tmp-install-check
          test -f .tmp-install-check/archi-orchestrator/SKILL.md
